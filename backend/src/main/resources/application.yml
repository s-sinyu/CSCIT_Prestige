# Shared configuration. Every secret comes from environment variables (see /.env.example).
spring:
  application:
    name: prestige-renovation
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prestige}
    username: ${SPRING_DATASOURCE_USERNAME:prestige}
    password: ${SPRING_DATASOURCE_PASSWORD:prestige}
    hikari:
      # Fail fast with a readable error if the database cannot be reached (PRD 12.3)
      initialization-fail-timeout: 1
      connection-timeout: 10000
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  zone: Asia/Singapore
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiry-hours: ${APP_JWT_EXPIRY_HOURS:8}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  images:
    max-per-project: 10
    max-bytes: 5242880
  seed:
    enabled: false
    size: 100
    password: ${APP_SEED_PASSWORD:Password123}

logging:
  level:
    root: INFO
    com.prestige.renovation: INFO
